services:
  - type: web
    name: aerorag-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: "sqlite:///./data/chat_history.db"
      - key: JWT_SECRET_KEY
        value: "enterprise-rag-assistant-secret-key-2026-secure-production"
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CHUNK_SIZE
        value: "500"
      - key: CHUNK_OVERLAP
        value: "50"
      - key: SIMILARITY_THRESHOLD
        value: "0.5"
      - key: TOP_K
        value: "3"
      - key: CHROMA_PERSIST_DIR
        value: "./data/chromadb"
      - key: RATE_LIMIT_CHAT_MAX_REQUESTS
        value: "15"
      - key: RATE_LIMIT_CHAT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_UPLOAD_MAX_REQUESTS
        value: "5"
      - key: RATE_LIMIT_UPLOAD_WINDOW_SECONDS
        value: "60"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: LOG_LEVEL
        value: "INFO"

  - type: static
    name: aerorag-frontend
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://aerorag-backend.onrender.com
